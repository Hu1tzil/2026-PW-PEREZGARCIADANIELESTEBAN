<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="./CSS/style.css">
  <meta charset="UTF-8">
  <title>Registrar Asistencia - CECyT 9</title>
</head>
<body>
  <header>
    <a href="./detalle.html">Volver al Taller</a>
  </header>
  <main>
    <form action="" class="formulario-registro" id="form-registro" novalidate>
      <h1>Registrar asistencia</h1>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>
      <span class="error" id="error-nombre"></span>
      <label for="boleta">Número de boleta: </label>
      <input type="text" id="boleta" name="boleta" required>
      <span class="error" id="error-boleta"></span>
      <label for="fecha">Fecha de registro (DD/MM/AAAA)</label>
      <input type="text" id="fecha" name="fecha" placeholder="DD/MM/AAAA">
      <span class="error" id="error-fecha"></span>
      <button type="submit">Registar</button>
      <p class="mensaje-exito" id="mensaje-exito"></p>
    </form>
  </main>
  <script src=""></script>
</body>
</html>
